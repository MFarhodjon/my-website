<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23172f">
  <meta name="description" content="One tiny question. Two suspiciously opinionated buttons.">
  <title>A Tiny Question</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap");

    :root {
      color-scheme: dark;
      --paper: #fdf3e7;
      --paper-shadow: #d8c6bd;
      --ink: #2e2440;
      --muted-ink: #695f76;
      --plum: #23172f;
      --plum-deep: #120b1d;
      --pink: #ff7a93;
      --pink-deep: #e85d7a;
      --teal: #38b8ad;
      --teal-deep: #279189;
      --yellow: #ffd166;
      --lavender: #b39ddb;
      --stage-dot: rgba(46, 36, 64, .13);
    }

    * { box-sizing: border-box; }

    html,
    body { min-width: 320px; min-height: 100%; }

    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 12%, rgba(118, 75, 137, .45), transparent 34%),
        radial-gradient(circle at 12% 84%, rgba(56, 184, 173, .12), transparent 29%),
        radial-gradient(circle at 89% 77%, rgba(232, 93, 122, .13), transparent 27%),
        linear-gradient(145deg, var(--plum), var(--plum-deep));
      font-family: "Nunito", ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; -webkit-tap-highlight-color: transparent; }

    button:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 4px;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      padding:
        max(35px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(35px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
    }

    .sky-doodle {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sky-doodle span {
      position: absolute;
      color: rgba(255, 244, 221, .74);
      font-family: Georgia, serif;
      font-size: var(--star-size, 1rem);
      opacity: .28;
      text-shadow: 0 0 15px rgba(255, 209, 102, .42);
      animation: twinkle var(--twinkle-speed, 3s) ease-in-out var(--twinkle-delay, 0s) infinite alternate;
    }

    .card {
      position: relative;
      width: min(520px, 90vw);
      padding: clamp(37px, 7vw, 55px) clamp(20px, 5.5vw, 39px) clamp(27px, 5vw, 38px);
      border: 1px solid rgba(91, 70, 93, .14);
      border-radius: 8px 13px 10px 6px;
      background:
        linear-gradient(90deg, transparent 39px, rgba(232, 93, 122, .13) 40px, rgba(232, 93, 122, .13) 41px, transparent 42px),
        repeating-linear-gradient(0deg, transparent 0 29px, rgba(46, 36, 64, .055) 30px, transparent 31px),
        var(--paper);
      box-shadow:
        0 38px 90px rgba(5, 2, 11, .46),
        0 7px 0 -3px var(--paper-shadow),
        inset 0 1px rgba(255, 255, 255, .85);
      text-align: center;
      transform: rotate(-1.6deg);
      isolation: isolate;
    }

    .card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 5px -7px -8px 6px;
      border-radius: inherit;
      background: #e8d8d4;
      transform: rotate(2.2deg);
      box-shadow: 0 13px 28px rgba(12, 6, 20, .2);
    }

    .washi-tape {
      position: absolute;
      z-index: 4;
      top: -18px;
      left: 50%;
      width: min(190px, 42%);
      height: 45px;
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,.2) 0 9px, transparent 9px 18px),
        rgba(255, 209, 102, .88);
      clip-path: polygon(2% 7%, 99% 0, 97% 91%, 76% 96%, 59% 90%, 40% 100%, 22% 91%, 0 97%);
      box-shadow: 0 3px 7px rgba(86, 62, 38, .12);
      transform: translateX(-50%) rotate(1.2deg);
    }

    .corner-doodle {
      position: absolute;
      right: 20px;
      top: 18px;
      color: rgba(46, 36, 64, .3);
      font: 700 2rem/1 "Caveat", cursive;
      transform: rotate(12deg);
    }

    h1 {
      max-width: 430px;
      margin: 0 auto;
      font: 700 clamp(3.05rem, 10vw, 4.8rem)/.88 "Caveat", cursive;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .question {
      max-width: 390px;
      margin: 18px auto 0;
      color: var(--muted-ink);
      font-size: clamp(.98rem, 3.1vw, 1.12rem);
      font-weight: 800;
      line-height: 1.45;
      text-wrap: balance;
    }

    .stage {
      position: relative;
      width: 100%;
      height: clamp(300px, 44vh, 375px);
      min-height: 300px;
      margin-top: 26px;
      overflow: hidden;
      border: 2px dashed rgba(46, 36, 64, .33);
      border-radius: 23px 17px 25px 19px;
      background-color: rgba(255, 255, 255, .26);
      background-image: radial-gradient(var(--stage-dot) 1.25px, transparent 1.25px);
      background-size: 17px 17px;
      box-shadow: inset 0 0 34px rgba(95, 65, 83, .055);
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      width: 40px;
      height: 15px;
      opacity: .48;
      background: var(--lavender);
    }

    .stage::before { left: -8px; top: 88px; transform: rotate(-8deg); }
    .stage::after { right: -8px; bottom: 35px; transform: rotate(7deg); background: var(--yellow); }

    .caption {
      position: absolute;
      z-index: 3;
      top: 21px;
      left: 50%;
      width: calc(100% - 34px);
      min-height: 70px;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      font: 700 clamp(1.55rem, 5.2vw, 2.05rem)/1.05 "Caveat", cursive;
      text-align: center;
      text-wrap: balance;
      transform: translateX(-50%);
      transition: opacity .15s ease, transform .2s ease;
      pointer-events: none;
    }

    .caption.pop { animation: caption-pop .3s cubic-bezier(.2,.8,.2,1); }

    .choice {
      position: absolute;
      z-index: 4;
      min-width: 126px;
      min-height: 57px;
      border: 0;
      border-radius: 18px 22px 17px 21px;
      padding: 13px 18px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition:
        left .2s cubic-bezier(.2,.9,.2,1),
        top .2s cubic-bezier(.2,.9,.2,1),
        transform .22s cubic-bezier(.2,.9,.2,1),
        filter .16s ease,
        box-shadow .18s ease;
    }

    .choice::after {
      content: "";
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: -7px;
      height: 9px;
      border-radius: 50%;
      background: rgba(46, 36, 64, .2);
      filter: blur(4px);
      transition: opacity .2s ease;
    }

    .yes-button {
      --yes-scale: 1;
      left: 10%;
      bottom: 53px;
      color: #fff;
      background: var(--teal);
      box-shadow: 0 7px 0 var(--teal-deep), 0 13px 22px rgba(39, 145, 137, .2);
      transform: scale(var(--yes-scale)) rotate(-1deg);
      transform-origin: center;
    }

    .yes-button:hover { filter: brightness(1.06); }
    .yes-button:active { box-shadow: 0 3px 0 var(--teal-deep); transform: translateY(4px) scale(var(--yes-scale)) rotate(-1deg); }

    .no-button {
      right: 10%;
      bottom: 53px;
      color: var(--ink);
      background: var(--pink);
      box-shadow: 0 7px 0 var(--pink-deep), 0 13px 22px rgba(232, 93, 122, .21);
      transform: rotate(1deg);
    }

    .no-button.has-dodged { transform: rotate(1deg); }

    .no-button.tired {
      color: #6e6876;
      background: #c9c3cc;
      box-shadow: 0 3px 0 #9f99a5;
      filter: grayscale(.45);
      cursor: not-allowed;
      transform: scale(.78) rotate(-9deg);
    }

    .no-button.tired::after { opacity: .35; }

    .hint {
      min-height: 21px;
      margin: 16px 8px 0;
      color: #7a7083;
      font-size: .76rem;
      font-weight: 800;
      line-height: 1.4;
    }

    .reveal {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: none;
      place-items: center;
      overflow: auto;
      padding:
        max(30px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(30px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 34%, rgba(179, 157, 219, .28), transparent 36%),
        rgba(24, 13, 35, .96);
      opacity: 0;
    }

    .reveal.show {
      display: grid;
      animation: reveal-in .48s ease forwards;
    }

    .reveal-card {
      position: relative;
      width: min(590px, 92vw);
      padding: clamp(45px, 9vw, 73px) clamp(27px, 7vw, 57px) clamp(38px, 8vw, 58px);
      border-radius: 9px 15px 8px 14px;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(46, 36, 64, .05) 32px, transparent 33px),
        var(--paper);
      box-shadow: 0 36px 100px rgba(0,0,0,.48), 8px 9px 0 rgba(179,157,219,.38);
      text-align: center;
      transform: rotate(1.2deg);
      animation: reveal-card-in .7s cubic-bezier(.16,.86,.25,1) .08s both;
    }

    .reveal-card::before {
      content: "FOR TODAY";
      position: absolute;
      top: 21px;
      right: 24px;
      padding: 7px 10px;
      border: 2px solid rgba(232, 93, 122, .6);
      border-radius: 50%;
      color: var(--pink-deep);
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .13em;
      transform: rotate(9deg);
    }

    .reveal-card::after {
      content: "";
      position: absolute;
      top: -18px;
      left: 50%;
      width: min(170px, 44%);
      height: 39px;
      background: rgba(56, 184, 173, .72);
      clip-path: polygon(0 8%, 100% 0, 96% 94%, 69% 88%, 49% 100%, 26% 91%, 3% 98%);
      transform: translateX(-50%) rotate(-2deg);
    }

    .reveal-kicker {
      margin: 0 0 15px;
      color: var(--pink-deep);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .sweet-message {
      margin: 0;
      font: 700 clamp(2.35rem, 8.6vw, 4.35rem)/.98 "Caveat", cursive;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .joke-line {
      margin: 24px auto 0;
      max-width: 430px;
      color: var(--teal-deep);
      font: italic 700 clamp(1.35rem, 5vw, 1.85rem)/1.1 "Caveat", cursive;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .45s ease, transform .45s ease;
      text-wrap: balance;
    }

    .joke-line.show { opacity: 1; transform: translateY(0); }

    .confetti {
      position: fixed;
      z-index: 70;
      top: -18px;
      width: var(--size, 9px);
      height: var(--size, 9px);
      border-radius: var(--radius, 1px);
      background: var(--confetti-color, var(--yellow));
      pointer-events: none;
      animation: fall var(--fall-speed, 4s) linear var(--fall-delay, 0s) forwards;
    }

    .screen-reader-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @keyframes twinkle {
      from { opacity: .18; transform: scale(.72) rotate(-5deg); }
      to { opacity: .78; transform: scale(1.18) rotate(7deg); }
    }

    @keyframes caption-pop {
      0% { opacity: .2; transform: translateX(-50%) translateY(7px) rotate(-1deg); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(0); }
    }

    @keyframes reveal-in { to { opacity: 1; } }

    @keyframes reveal-card-in {
      from { opacity: 0; transform: translateY(30px) scale(.94) rotate(-2deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(1.2deg); }
    }

    @keyframes fall {
      0% { opacity: 0; transform: translate3d(0, -5vh, 0) rotate(0); }
      8% { opacity: 1; }
      100% { opacity: .9; transform: translate3d(var(--drift, 25px), 112vh, 0) rotate(var(--spin, 720deg)); }
    }

    @media (max-width: 430px) {
      .page-shell { padding-left: 12px; padding-right: 12px; }
      .card { width: 100%; padding-left: 16px; padding-right: 16px; transform: rotate(-.7deg); }
      .stage { height: min(360px, 48dvh); min-height: 292px; }
      .choice { min-width: 112px; min-height: 55px; padding-left: 11px; padding-right: 11px; font-size: .88rem; }
      .yes-button { left: 10%; }
      .no-button { right: 10%; }
      .reveal-card { width: 100%; }
    }

    @media (max-width: 350px) {
      .yes-button { left: 50%; bottom: 111px; transform: translateX(-50%) scale(var(--yes-scale)) rotate(-1deg); }
      .yes-button:active { transform: translateX(-50%) translateY(4px) scale(var(--yes-scale)) rotate(-1deg); }
      .no-button:not(.has-dodged) { right: auto; left: 50%; bottom: 32px; transform: translateX(-50%) rotate(1deg); }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      .page-shell { align-items: start; padding-top: 28px; }
      .card { width: min(720px, 92vw); padding: 28px 30px 22px; }
      h1 { font-size: 3.05rem; }
      .question { margin-top: 8px; }
      .stage { height: 270px; min-height: 270px; margin-top: 14px; }
      .caption { min-height: 57px; top: 13px; }
      .hint { margin-top: 9px; }
      .reveal-card { margin: 18px 0; padding-top: 42px; padding-bottom: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .confetti { display: none !important; }
      .sky-doodle span { opacity: .45; }
    }
  </style>
</head>
<body>
  <div class="sky-doodle" id="skyDoodle" aria-hidden="true"></div>

  <main class="page-shell">
    <article class="card" aria-labelledby="pageTitle">
      <div class="washi-tape" aria-hidden="true"></div>
      <span class="corner-doodle" aria-hidden="true">↝</span>

      <!-- EDIT ME: Change this headline to her name or your own greeting. -->
      <h1 id="pageTitle">Hey, you ✦</h1>

      <!-- EDIT ME: Change the yes-or-no question here. -->
      <p class="question">Will you give me that job?</p>

      <div class="stage" id="stage">
        <p class="caption" id="caption" aria-live="polite">Choose carefully. One button is dramatic.</p>
        <button class="choice yes-button" id="yesBtn" type="button">Yes, surprise me</button>
        <button class="choice no-button" id="noBtn" type="button">Nope</button>
      </div>

      <p class="hint" id="hint">The buttons are mostly cooperative.</p>
    </article>
  </main>

  <section class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="revealMessage" hidden>
    <div class="reveal-card" tabindex="-1">
      <p class="reveal-kicker">A tiny note</p>

      <!-- EDIT ME: Change the final sweet message here. -->
      <p class="sweet-message" id="revealMessage">Good choice. I made this tiny corner of the internet just to put one unexpected smile in your day.</p>

      <!-- EDIT ME: Change the second punchline here. Its delay is marked in the script below. -->
      <p class="joke-line" id="jokeLine">The No button is currently updating its résumé.</p>
    </div>
  </section>

  <div class="screen-reader-only" id="announcer" aria-live="assertive"></div>

  <script>
    // EDIT ME: Each line appears in this exact order when the No button dodges.
    const JOKES = [
      "Oh. That button has trust issues.",
      "Excellent cardio for a rectangle.",
      "It has now entered witness protection.",
      "This is becoming an HR matter.",
      "The button has requested a lawyer.",
      "One last dramatic escape attempt..."
    ];

    // EDIT ME: This replaces the caption when the No button finally gives up.
    const TIRED_JOKE = "Breaking news: local button defeated by basic geometry.";

    // EDIT ME: Change 900 to adjust the second punchline delay after the reveal.
    const REVEAL_JOKE_DELAY = 900;

    const stage = document.getElementById("stage");
    const caption = document.getElementById("caption");
    const hint = document.getElementById("hint");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const pageShell = document.querySelector(".page-shell");
    const reveal = document.getElementById("reveal");
    const revealCard = reveal.querySelector(".reveal-card");
    const jokeLine = document.getElementById("jokeLine");
    const announcer = document.getElementById("announcer");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let dodgeCount = 0;
    let dodgeLocked = false;
    let lastDodgeAt = 0;
    let lastPointer = null;
    let revealed = false;
    const maxDodges = JOKES.length;

    function overlaps(first, second, gap = 0) {
      return !(
        first.right + gap < second.left ||
        first.left - gap > second.right ||
        first.bottom + gap < second.top ||
        first.top - gap > second.bottom
      );
    }

    function pickDodgePosition(stageRect, buttonRect) {
      const padding = 12;
      const captionSafeTop = Math.min(112, stageRect.height * .34);
      const maxX = Math.max(padding, stageRect.width - buttonRect.width - padding);
      const maxY = Math.max(captionSafeTop, stageRect.height - buttonRect.height - padding);
      const yesRect = yesBtn.getBoundingClientRect();
      const yesInsideStage = {
        left: yesRect.left - stageRect.left,
        right: yesRect.right - stageRect.left,
        top: yesRect.top - stageRect.top,
        bottom: yesRect.bottom - stageRect.top
      };

      function isValid(candidate) {
        const avoidsYes = !overlaps(candidate, yesInsideStage, 14);
        const avoidsPointer = !lastPointer || Math.hypot(
          stageRect.left + candidate.left + buttonRect.width / 2 - lastPointer.x,
          stageRect.top + candidate.top + buttonRect.height / 2 - lastPointer.y
        ) > 90;
        return avoidsYes && avoidsPointer;
      }

      for (let attempt = 0; attempt < 24; attempt += 1) {
        const x = padding + Math.random() * Math.max(1, maxX - padding);
        const y = captionSafeTop + Math.random() * Math.max(1, maxY - captionSafeTop);
        const candidate = {
          left: x,
          right: x + buttonRect.width,
          top: y,
          bottom: y + buttonRect.height
        };
        if (isValid(candidate)) return { x, y };
      }

      const gridX = [padding, (padding + maxX) / 2, maxX];
      const gridY = [captionSafeTop, (captionSafeTop + maxY) / 2, maxY];
      let best = null;
      let bestScore = -Infinity;
      for (const x of gridX) {
        for (const y of gridY) {
          const candidate = {
            left: x,
            right: x + buttonRect.width,
            top: y,
            bottom: y + buttonRect.height
          };
          if (!isValid(candidate)) continue;
          const pointerDistance = lastPointer
            ? Math.hypot(stageRect.left + x - lastPointer.x, stageRect.top + y - lastPointer.y)
            : 0;
          const yesDistance = Math.hypot(candidate.left - yesInsideStage.left, candidate.top - yesInsideStage.top);
          const score = pointerDistance + yesDistance;
          if (score > bestScore) {
            best = { x, y };
            bestScore = score;
          }
        }
      }
      return best || { x: maxX, y: maxY };
    }

    function updateYesScale(count = dodgeCount) {
      if (reducedMotion.matches) {
        yesBtn.style.setProperty("--yes-scale", "1");
        return;
      }
      const stageRect = stage.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const center = yesRect.left + yesRect.width / 2 - stageRect.left;
      const availableHalfWidth = Math.max(yesBtn.offsetWidth / 2, Math.min(center - 12, stageRect.width - center - 12));
      const maxScale = Math.max(1, (availableHalfWidth * 2) / yesBtn.offsetWidth);
      const desiredScale = 1 + count * .06;
      yesBtn.style.setProperty("--yes-scale", Math.min(desiredScale, maxScale, 1.36).toFixed(2));
    }

    function repositionEscapedButton() {
      updateYesScale();
      if (!noBtn.classList.contains("has-dodged")) return;
      const stageRect = stage.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const safelyInside = noRect.left >= stageRect.left + 5 &&
        noRect.right <= stageRect.right - 5 &&
        noRect.top >= stageRect.top + 5 &&
        noRect.bottom <= stageRect.bottom - 5;
      if (safelyInside && !overlaps(noRect, yesRect, 8)) return;
      const position = pickDodgePosition(stageRect, {
        width: noBtn.offsetWidth,
        height: noBtn.offsetHeight
      });
      noBtn.style.left = `${position.x}px`;
      noBtn.style.top = `${position.y}px`;
    }

    function refreshCaption(text) {
      caption.textContent = text;
      caption.classList.remove("pop");
      void caption.offsetWidth;
      caption.classList.add("pop");
    }

    function dodge() {
      if (dodgeCount >= maxDodges || dodgeLocked) return;
      dodgeLocked = true;
      lastDodgeAt = performance.now();
      window.setTimeout(() => { dodgeLocked = false; }, reducedMotion.matches ? 40 : 230);

      const nextCount = dodgeCount + 1;
      updateYesScale(nextCount);
      if (!reducedMotion.matches) {
        const stageRect = stage.getBoundingClientRect();
        const buttonRect = noBtn.getBoundingClientRect();
        const position = pickDodgePosition(stageRect, buttonRect);

        noBtn.classList.add("has-dodged");
        noBtn.style.right = "auto";
        noBtn.style.bottom = "auto";
        noBtn.style.left = `${position.x}px`;
        noBtn.style.top = `${position.y}px`;
      }

      refreshCaption(JOKES[dodgeCount]);
      dodgeCount = nextCount;

      const escapesLeft = maxDodges - dodgeCount;
      hint.textContent = escapesLeft === 1
        ? "One emergency escape remains."
        : `${escapesLeft} emergency escapes remain.`;

      if (dodgeCount === maxDodges) {
        const noHadFocus = document.activeElement === noBtn;
        noBtn.classList.add("tired");
        noBtn.disabled = true;
        noBtn.textContent = "I give up 😩";
        refreshCaption(TIRED_JOKE);
        hint.textContent = "The No button has officially submitted its resignation.";
        announcer.textContent = `${TIRED_JOKE} The No button has given up. Yes, surprise me is now available.`;
        if (noHadFocus) yesBtn.focus({ preventScroll: true });
      }
    }

    function launchConfetti() {
      if (reducedMotion.matches) return;
      const colors = ["#ffd166", "#ff7a93", "#38b8ad", "#b39ddb", "#fdf3e7"];

      for (let index = 0; index < 60; index += 1) {
        const piece = document.createElement("div");
        const duration = 3.3 + Math.random() * 1.6;
        const delay = Math.random() * .65;
        piece.className = "confetti";
        piece.setAttribute("aria-hidden", "true");
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.setProperty("--size", `${6 + Math.random() * 8}px`);
        piece.style.setProperty("--radius", Math.random() > .68 ? "50%" : "1px");
        piece.style.setProperty("--confetti-color", colors[index % colors.length]);
        piece.style.setProperty("--fall-speed", `${duration}s`);
        piece.style.setProperty("--fall-delay", `${delay}s`);
        piece.style.setProperty("--drift", `${-65 + Math.random() * 130}px`);
        piece.style.setProperty("--spin", `${Math.random() > .5 ? "" : "-"}${450 + Math.round(Math.random() * 630)}deg`);
        document.body.appendChild(piece);
        window.setTimeout(() => piece.remove(), (duration + delay) * 1000 + 120);
      }
    }

    function showReveal() {
      if (revealed) return;
      revealed = true;
      yesBtn.disabled = true;
      reveal.hidden = false;
      reveal.classList.add("show");
      revealCard.focus({ preventScroll: true });
      pageShell.inert = true;
      pageShell.setAttribute("aria-hidden", "true");
      launchConfetti();
      document.title = "A Little Surprise";
      announcer.textContent = document.getElementById("revealMessage").textContent;
      window.setTimeout(() => {
        jokeLine.classList.add("show");
        announcer.textContent = jokeLine.textContent;
      }, reducedMotion.matches ? 0 : REVEAL_JOKE_DELAY);
    }

    noBtn.addEventListener("mouseenter", (event) => {
      lastPointer = { x: event.clientX, y: event.clientY };
      dodge();
    });

    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      const touch = event.touches[0];
      if (touch) lastPointer = { x: touch.clientX, y: touch.clientY };
      dodge();
    }, { passive: false });

    noBtn.addEventListener("click", (event) => {
      const isKeyboardOrProgrammatic = event.detail === 0;
      const isFreshFallback = performance.now() - lastDodgeAt > 280;
      if (!noBtn.disabled && (isKeyboardOrProgrammatic || isFreshFallback)) dodge();
    });

    stage.addEventListener("pointermove", (event) => {
      lastPointer = { x: event.clientX, y: event.clientY };
    }, { passive: true });

    yesBtn.addEventListener("click", showReveal);

    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(repositionEscapedButton, 90);
    }, { passive: true });

    reducedMotion.addEventListener("change", repositionEscapedButton);
    if (document.fonts?.ready) document.fonts.ready.then(repositionEscapedButton);

    const starCharacters = ["✦", "✧", "✿"];
    const skyDoodle = document.getElementById("skyDoodle");
    for (let index = 0; index < 22; index += 1) {
      const star = document.createElement("span");
      star.textContent = starCharacters[index % starCharacters.length];
      star.style.left = `${3 + Math.random() * 94}%`;
      star.style.top = `${2 + Math.random() * 95}%`;
      star.style.setProperty("--star-size", `${.65 + Math.random() * 1.15}rem`);
      star.style.setProperty("--twinkle-speed", `${2.1 + Math.random() * 2.8}s`);
      star.style.setProperty("--twinkle-delay", `${-Math.random() * 4}s`);
      skyDoodle.appendChild(star);
    }
  </script>
</body>
</html>
